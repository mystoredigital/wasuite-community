<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>My Store · CRM + WhatsApp</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<style>
  :root { --panel-w: 440px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1419; }

  .stage { display: flex; height: 100%; width: 100%; }

  /* CRM ocupa todo; el panel WA se acopla a la derecha */
  #crm { flex: 1; border: 0; height: 100%; min-width: 0; }

  #wa-panel {
    width: var(--panel-w);
    max-width: 92vw;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #0f1419;
    border-left: 1px solid #2a3744;
    transition: margin-right .25s ease;
  }
  #wa-panel.hidden { margin-right: calc(var(--panel-w) * -1); }

  .wa-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    background: #16202a; border-bottom: 1px solid #2a3744;
    color: #e7e9ea; font: 600 13px -apple-system, system-ui, sans-serif;
    flex: 0 0 auto;
  }
  .wa-head .dot { width: 8px; height: 8px; border-radius: 50%; background: #25d366; }
  .wa-head .spacer { flex: 1; }
  .wa-head a, .wa-head button {
    background: none; border: 0; color: #8899a6; cursor: pointer;
    font-size: 15px; line-height: 1; padding: 4px 6px; text-decoration: none;
    border-radius: 6px;
  }
  .wa-head a:hover, .wa-head button:hover { background: #1d2a36; color: #e7e9ea; }

  #wa { flex: 1; border: 0; width: 100%; min-height: 0; }

  /* Botón flotante para abrir el panel cuando está oculto */
  #wa-fab {
    position: fixed; right: 18px; bottom: 18px; z-index: 10;
    width: 54px; height: 54px; border-radius: 50%;
    background: #25d366; border: 0; cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,.45);
    display: none; align-items: center; justify-content: center;
    transition: transform .15s ease;
  }
  #wa-fab:hover { transform: scale(1.08); }
  #wa-fab svg { width: 28px; height: 28px; fill: #fff; }
  body.wa-hidden #wa-fab { display: flex; }

  @media (max-width: 900px) {
    :root { --panel-w: 100vw; }
    #wa-panel { position: fixed; right: 0; top: 0; z-index: 5; }
  }
</style>
</head>
<body>
<div class="stage">
  <iframe id="crm" src="" title="Twenty CRM" allow="clipboard-read; clipboard-write"></iframe>

  <div id="wa-panel">
    <div class="wa-head">
      <span class="dot"></span> WhatsApp
      <span class="spacer"></span>
      <a id="wa-pop" href="/" target="_blank" title="Abrir en pestaña propia">⧉</a>
      <button id="wa-close" title="Ocultar panel">✕</button>
    </div>
    <iframe id="wa" src="/" title="WhatsApp Agent" allow="clipboard-read; clipboard-write; microphone"></iframe>
  </div>
</div>

<button id="wa-fab" title="Abrir WhatsApp">
  <svg viewBox="0 0 24 24"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2zm5.83 14.16c-.25.69-1.42 1.32-1.96 1.36-.53.05-1.03.24-3.46-.72-2.93-1.15-4.78-4.14-4.92-4.33-.14-.19-1.17-1.56-1.17-2.97 0-1.41.74-2.1 1-2.39.26-.29.57-.36.76-.36.19 0 .38 0 .54.01.18.01.41-.07.64.49.24.56.8 1.94.87 2.08.07.14.12.31.02.5-.09.19-.14.31-.28.47-.14.17-.3.37-.42.5-.14.14-.29.29-.13.57.17.28.74 1.22 1.59 1.98 1.09.97 2.01 1.27 2.29 1.41.28.14.45.12.61-.07.17-.19.71-.82.89-1.11.19-.28.38-.24.63-.14.26.09 1.63.77 1.91.91.28.14.47.21.54.33.07.12.07.69-.18 1.38z"/></svg>
</button>

<script>
  // La URL pública del CRM la inyecta el servidor desde CRM_PUBLIC_URL (cambia
  // por instalación). Se puede sobreescribir con ?crm= para pruebas.
  const params = new URLSearchParams(location.search);
  const INJECTED = '__CRM_PUBLIC_URL__';
  // Si el server no la reemplazó, el placeholder llega tal cual: no lo cargamos
  // como URL — mejor decir qué falta que dejar un iframe roto en blanco.
  const CRM_URL = params.get('crm') || (INJECTED.includes('__CRM_PUBLIC_URL') ? '' : INJECTED);

  const crmFrame = document.getElementById('crm');
  if (CRM_URL) {
    crmFrame.src = CRM_URL;
  } else {
    crmFrame.replaceWith(Object.assign(document.createElement('div'), {
      style: 'flex:1;display:flex;align-items:center;justify-content:center;'
        + 'padding:24px;text-align:center;color:#8899a6;'
        + 'font:14px -apple-system,system-ui,sans-serif;line-height:1.6',
      innerHTML: 'Falta configurar <code style="color:#e7e9ea">CRM_PUBLIC_URL</code>'
        + ' con la URL pública del CRM.<br>El panel de WhatsApp sigue funcionando.',
    }));
  }

  const panel = document.getElementById('wa-panel');

  // Recordar si el usuario dejó el panel abierto o cerrado
  const KEY = 'hub.wa.open';
  function setOpen(open) {
    panel.classList.toggle('hidden', !open);
    document.body.classList.toggle('wa-hidden', !open);
    try { localStorage.setItem(KEY, open ? '1' : '0'); } catch {}
  }
  document.getElementById('wa-close').onclick = () => setOpen(false);
  document.getElementById('wa-fab').onclick = () => setOpen(true);

  let initialOpen = true;
  try { initialOpen = localStorage.getItem(KEY) !== '0'; } catch {}
  setOpen(initialOpen);
</script>
</body>
</html>
